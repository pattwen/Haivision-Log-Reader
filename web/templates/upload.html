{% extends 'base.html' %}

{% block title %}{{ t('upload.title') }}{% endblock %}

{% block content %}
<div class="card">
    <h2>{{ t('upload.card_title') }}</h2>
    <p style="color: var(--text-muted);">{{ t('upload.support_hint') }}</p>
    
    <div id="upload-area" class="upload-area">
        <p style="font-size: 1.1rem; font-weight: 500; color: var(--primary-color);">{{ t('upload.drag_hint') }}</p>
        <p style="font-size: 0.875rem; color: var(--text-muted);">{{ t('upload.format_limit') }}</p>
        <input type="file" id="file-input" style="display: none;" accept=".json">
    </div>

    <div id="upload-status" style="margin-top: 1rem; font-weight: 500; text-align: center;"></div>
</div>
{% endblock %}
