<!DOCTYPE html>
<html lang="{{ current_lang if current_lang else 'zh-CN' }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Haivision Log Reader{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <nav class="navbar">
        <a href="{{ url_for('upload.upload_page') }}" class="brand">{{ t('nav.brand') }}</a>
        <div class="nav-links" style="display: flex; align-items: center; gap: 1.5rem;">
            <a href="{{ url_for('upload.upload_page') }}">{{ t('nav.upload') }}</a>
            <a href="{{ url_for('tasks.task_list_page') }}">{{ t('nav.tasks') }}</a>

            <select id="lang-selector" onchange="location.href='/set_language/' + this.value;"
                style="padding: 0.25rem 0.5rem; font-size: 0.875rem; border-radius: 4px; border: 1px solid var(--border-color); background-color: #fff; cursor: pointer;">
                <option value="zh_CN" {% if current_lang=='zh_CN' %}selected{% endif %}>简体中文</option>
                <option value="en_US" {% if current_lang=='en_US' %}selected{% endif %}>English</option>
            </select>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <script src="{{ url_for('static', filename='js/js.js') }}"></script>
    <script>
        function changeLanguage(lang) {
            const url = new URL(window.location.href);
            url.searchParams.set('lang', lang);
            window.location.href = url.toString();
        }
    </script>
    {% block scripts %}{% endblock %}
</body>

</html>
